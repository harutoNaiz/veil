name: brain-tapes
on:
  push:
  pull_request:
jobs:
  tapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cd guard && chmod +x gradlew && ./gradlew --no-daemon -Pveil.brainOnly=true :brain:test
